server:
  port: 8082

spring:
  application:
    name: inventory-service
  datasource:
    url: jdbc:h2:mem:inventory;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
      use-new-id-generator-mappings: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        jdbc:
          lob:
            non_contextual_creation: true
  h2:
    console:
      enabled: true
      path: /h2-console
  cache:
    type: simple
    cache-names: stock

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,caches
  metrics:
    export:
      simple:
        enabled: true
  trace:
    http:
      enabled: false
